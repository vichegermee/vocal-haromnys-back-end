services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vocal_harmonys
      POSTGRES_USER: vocal_harmonys
      POSTGRES_PASSWORD: vocal_harmonys
    ports:
      # Host port 5433, not 5432 — many dev machines already have a native
      # Postgres bound to 5432 (Homebrew, another project's Docker setup...),
      # and binding the same host port silently routes connections to
      # whichever one the OS picks, not necessarily this container.
      - "5433:5432"
    volumes:
      - vocal-harmonys-db-data:/var/lib/postgresql/data

volumes:
  vocal-harmonys-db-data:
