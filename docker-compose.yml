services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vocal_harmonys
      POSTGRES_USER: vocal_harmonys
      POSTGRES_PASSWORD: vocal_harmonys
    ports:
      - "5432:5432"
    volumes:
      - vocal-harmonys-db-data:/var/lib/postgresql/data

volumes:
  vocal-harmonys-db-data:
